name: Bug report
description: Something doesn't work — a failed connection, wrong tracks, a REAPER error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The diagnostic log is what makes a
        connection bug fixable rather than guessable — please include it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        Clicked "Fetch tracks". The status line stayed on "Connecting to the
        LV1..." for about 20 s and then went red.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: >
        Settings → Advanced → tick "Verbose diagnostic log", fetch again, then
        copy the whole "Diagnostic log" panel. It contains every zDNS packet
        and OSC message exchanged. It also contains your LAN IP addresses and
        your console's name — redact them if you'd rather not post them.
      render: text
    validations:
      required: false

  - type: input
    id: lv1-mode
    attributes:
      label: LV1 mode and version
      placeholder: "64 ch, LV1 v14.x"
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Importer / REAPER / ReaImGui / Node versions
      description: The importer version is in the script header (@version).
      placeholder: "2.1.0 / REAPER 7.x / ReaImGui 0.9.x / Node 20"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Only Windows has been tested so far — macOS and Linux reports are especially welcome.
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
